apiVersion: v1
kind: ConfigMap
metadata:
  name: app3-html
  namespace: default

data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>App3</title>
    </head>

    <body>
      <h1>App3</h1>
      <p>This HTML page is coming from a ConfigMap.</p>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  namespace: default
  labels:
    app: app3

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app3

  template:
    metadata:
      labels:
        app: app3

    spec:
      containers:
      - name: nginx
        image: nginx:latest

        ports:
        - containerPort: 80

        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html

      volumes:
      - name: html-volume
        configMap:
          name: app3-html
          items:
          - key: index.html
            path: index.html

---
apiVersion: v1
kind: Service
metadata:
  name: app3-service
  namespace: default

spec:
  selector:
    app: app3

  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

  type: ClusterIP
