apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector:
    type: webserver
  ports:
  - protocol: TCP
    port: 80

apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - containerPort: 80
          name: app1

