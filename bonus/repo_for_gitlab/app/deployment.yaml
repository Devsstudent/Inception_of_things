apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil
  labels:
    app: wil
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wil
  template:
    metadata:
      labels:
        app: wil
    spec:
      containers:
      - name: playground
        image: wil42/playground:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8888
